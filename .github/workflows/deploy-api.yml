# Story 8.1: deploy services/api to Cloud Run staging (docs/data-model-goal8.md §5, §9).
# Manual on purpose (G7): the service can depend on a migration that is pushed to staging by hand.
# Workload Identity Federation, no JSON key. Repo variables GCP_PROJECT_ID and GCP_PROJECT_NUMBER are set by the owner.
name: Deploy API (staging)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1
  IMAGE: asia-northeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/assetly/api:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: assetly-api-deploy@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - run: docker build -t "$IMAGE" services/api && docker push "$IMAGE"
      - name: Deploy
        run: |
          gcloud run deploy assetly-api --region "$REGION" --image "$IMAGE" \
            --service-account "assetly-api-run@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-secrets DATABASE_URL=assetly-api-db-url:latest \
            --set-env-vars SUPABASE_URL=https://blhxyfgkkhpqbfuhpnww.supabase.co \
            --min-instances 0 --max-instances 2 --cpu 1 --memory 512Mi --concurrency 40 \
            --cpu-throttling --allow-unauthenticated
      - run: curl -fsS "$(gcloud run services describe assetly-api --region "$REGION" --format 'value(status.url)')/health"
